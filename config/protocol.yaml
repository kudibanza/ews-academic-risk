# ============================================================
# PROTOCOL CONTRACT — Early Warning System (EWS)
# Frozen before any experiment.
# Any change requires a new version + written justification.
# ============================================================
protocol_version: "1.0.1"
frozen_date: "2026-11-09"
author: "Kudibanza Afonso Pemba (3820251124)"

# ---------- 1. DATASET ----------
dataset:
  name: "OULAD"
  source: "Kuzilek, Hlosta & Zdrahal (2017), Scientific Data 4:170171"
  doi: "10.1038/sdata.2017.171"
  files_required:
    - "courses.csv"
    - "assessments.csv"
    - "vle.csv"
    - "studentAssessment.csv"
    - "studentVle.csv"
    - "studentInfo.csv"
    - "studentRegistration.csv"
  integrity:
    checksum_algorithm: "sha256"
    checksums_recorded: true
    manifest: "data/raw/checksums_manifest.csv"
    note: >
      Checksums recorded 2026-11-09 from the local copy of OULAD.
      UCI does not publish per-file SHA-256 values, so these hashes
      serve as the local integrity baseline for all downstream steps.
      Any future re-download must reproduce these values or trigger
      a protocol version bump.
  presentations:
    train: ["2013B", "2013J"]
    test:  ["2014B", "2014J"]   # cross-cohort generalization check
  audit_notes:
    unique_students: 28785
    student_module_presentation_rows: 32593
    overlap_rows: 3808          # rows - unique students
    overlap_students: 3538      # students with >1 row
    note: >
      Two distinct quantities must not be conflated. overlap_rows = 3,808
      is the number of excess rows (32,593 - 28,785). overlap_students =
      3,538 is the number of distinct students appearing in more than one
      module presentation. The difference (3,808 vs 3,538) arises because
      some students appear in 3+ presentations. Rule 4 (student-level group
      isolation) is mandatory either way: 3,538 students would leak across
      folds under a naive random split.
    target_stability:
      risk_proportion_by_presentation:
        "2013B": 0.553
        "2013J": 0.494
        "2014B": 0.570
        "2014J": 0.515
      note: >
        Risk proportion varies by ~8 percentage points across
        presentations. The cross-cohort check (train 2013, test 2014)
        must be interpreted with this variation in mind.
    temporal:
      max_module_length_days: 269
      students_with_vle_activity_by_W2: 25111
      coverage_W2: "87.2% of unique students"
    canonical_counts_verified:
      studentVle_rows: 10655280
      studentAssessment_rows: 173912
      modules: 7
      presentations: 4
      module_presentations: 22
    schema_validation:
      pytest_passed: 16
      pytest_failed: 0
      report: "experiments/01_data_audit/audit_report.md"
      summary: "experiments/01_data_audit/audit_summary.json"

# ---------- 2. TARGET ----------
target:
  primary:
    name: "academic_risk"
    definition: "1 if final_result in {'Withdrawn', 'Fail'} else 0"
    rationale: >
      Combined target because the operational cost of a false negative
      (a student who either withdraws OR fails) is identical from the
      coordinator's perspective. Avoids fragmenting the positive class
      at early windows (W2), where minority-class insufficiency is
      already critical.
    class_balance_note: "report counts per window and per presentation"
  secondary_exploratory:
    name: "dropout_only"
    definition: "1 if final_result == 'Withdrawn' else 0"
    status: "EXPLORATORY — not pre-registered for primary decisions"
    purpose: "discussion analysis; same pipeline, same features"

# ---------- 3. TEMPORAL WINDOWS ----------
temporal_windows:
  unit: "days_since_course_start"
  cutoffs:
    W2: 14
    W4: 28
    W6: 42
    W8: 56
  rule: "activity_date <= cutoff_days"
  rationale: "full academic weeks; aligned with Zhang & Duan (2026)"

# ---------- 4. OPERATIONAL EXCLUSION ----------
exclusion_rule:
  condition: "date_unregistration.notna() AND date_unregistration <= cutoff_days(window)"
  action: "EXCLUDE from sample at that window (do not label as negative)"
  rationale: >
    Prevents two leakage pathways: (i) absence of later activity being
    misread as 'at-risk but still enrolled'; (ii) date_unregistration
    close to the cutoff acting as a near-trivial proxy for the outcome.
  students_unregistering_after_cutoff: "retain in sample (still active)"
  independence_from_registration_date: >
    The exclusion condition depends ONLY on date_unregistration, never
    on date_registration. Students with null date_registration but
    non-null date_unregistration are excluded by the same rule. This
    prevents a leakage pathway where requiring date_registration.notna()
    would silently retain students who had already left.

# ---------- 4.1 EDGE CASES (from data audit) ----------
edge_cases:
  negative_unregistration_dates:
    observed: "date_unregistration ranges from -365 to 444 days"
    interpretation: >
      Negative values indicate withdrawal before the official course
      start. These students are correctly excluded at every window by
      the rule above.
    action: "no special handling; the standard exclusion rule applies"
  null_registration_with_null_unregistration:
    observed: "45 rows in studentRegistration.csv"
    interpretation: >
      Students with neither a registration nor an unregistration date.
      They have a final_result recorded, so they belong to the target
      population. There is no evidence of withdrawal.
    action: "INCLUDE in sample at all windows"
    rationale: >
      Excluding them would introduce unjustified selection bias.
      Their missing date_registration does not affect the exclusion
      rule, which depends only on date_unregistration.
  integer_encoding:
    observed: "date_registration and date_unregistration stored as float64 by pandas"
    verification: "no fractional values in either column (audit confirmed)"
    action: "convert to pandas nullable Int64 in Step 2"

# ---------- 5. FEATURES (per window, cumulative) ----------
features:
  - name: "S_vle"
    source: "studentVle.sum_click"
    definition: "cumulative sum of clicks up to the cutoff"
  - name: "D_active"
    source: "studentVle.date"
    definition: "number of distinct days with >=1 click up to the cutoff"
  - name: "H_entropy"
    source: "vle.activity_type × studentVle"
    definition: "Shannon entropy over 20 categories; H in [0, log2(20)]"
    formula: "H = -sum(p_c * log2(p_c))"
  - name: "Delta_t"
    source: "studentAssessment.date_submitted - assessments.date"
    definition: "mean submission latency (days) for assessments due by the cutoff"
  - name: "S_score"
    source: "studentAssessment.score"
    definition: "mean score across assessments submitted by the cutoff"
  - name: "still_registered"
    source: "studentRegistration.date_unregistration"
    definition: "binary flag: 1 if still registered at the cutoff"
    note: "after operational exclusion, this flag is always 1 in the sample — document it"
  - name: "click_trend"
    source: "studentVle.sum_click"
    definition: >
      Mean daily clicks in the two most recent weeks up to the cutoff,
      minus mean daily clicks in the two weeks immediately preceding them.
      For W2, uses week 2 minus week 1 (only one preceding week available).
    formula: >
      click_trend(w_k) = mean_daily_clicks(w_{k-2}..w_k)
                        - mean_daily_clicks(w_{k-4}..w_{k-2})
    windows_available: ["W4", "W6", "W8"]   # W2 uses a reduced form
    w2_reduced_form: "mean_daily_clicks(week 2) - mean_daily_clicks(week 1)"
    rationale: >
      Captures the direction of engagement. Cumulative features cannot
      distinguish a student who clicked 100 times in week 1 then stopped
      from one who clicked 100 times in week 3 and is accelerating.
      Disengagement trajectory is a documented early-warning signal in
      OULAD-based studies.
    leakage_note: "uses only activity with date <= cutoff_k (Rule 3)"  

# ---------- 6. ZERO-LEAKAGE INVARIANTS ----------
zero_leakage:
  rule_1_preprocessing_isolation: >
    Imputers and scalers are fit ONLY on the training fold of each CV
    split; applied without refitting to validation and test folds.
  rule_2_resampling_boundary: >
    SMOTE/ADASYN/Tomek ONLY after the split, ONLY on the training fold.
    Test folds are never resampled; evaluated on their natural distribution.
  rule_3_temporal_boundary: >
    Cumulative features for W_k use only records with date <= cutoff_k,
    computed per student, BEFORE any split.
  rule_4_student_group_isolation: >
    CV folds are constructed at the student_id level (GroupKFold).
    No student_id appears in more than one fold.
    Applied JOINTLY with rule_3 (temporal AND group boundary).
  verification:
    - "assert: no student_id appears in both train and test"
    - "assert: max(feature_date) <= cutoff for each window"
    - "assert: scaler statistics fit on training fold only"

# ---------- 6.1 LEAKAGE REFERENCES ----------
leakage_references:
  rule_1_preprocessing:
    - "Kapoor & Narayanan (2023), Patterns 4(9):100804, doi:10.1016/j.patter.2023.100804"
  rule_2_resampling:
    - "Kapoor & Narayanan (2023), Patterns 4(9):100804, doi:10.1016/j.patter.2023.100804"
    - "Mduma (2023), Data 8(3):49, doi:10.3390/data8030049"
  rule_3_temporal:
    - "Barros et al. (2023), arXiv:2305.08600"
    - "Zhang & Duan (2026), Scientific Reports, doi:10.1038/s41598-026-68508-4"
  rule_4_student_group:
    - "Zhang & Duan (2026), Scientific Reports, doi:10.1038/s41598-026-68508-4"
    
# ---------- 7. VALIDATION PROTOCOL ----------
validation:
  primary_cv:
    method: "GroupKFold"
    n_splits: 5
    group: "student_id"
    stratify_note: "check class proportion per fold; report it"
  cross_cohort_check:
    method: "train on {2013B,2013J} -> test on {2014B,2014J}"
    retraining: false
    threshold_recalibration: false
    report: "delta AUC and delta PR-AUC vs. CV"

# ---------- 8. CLASS IMBALANCE STRATEGIES (benchmark) ----------
imbalance:
  strategies:
    - "none (baseline)"
    - "SMOTE"
    - "ADASYN"
    - "Tomek Links (undersampling)"
    - "class_weight (ratio non-dropout:dropout)"
  application: "training fold only (rule_2)"
  calibration:
    methods: ["Platt (sigmoid)", "isotonic"]
    applied_to: "final classifiers before threshold tuning"
    metrics: ["ECE", "Brier score"]

# ---------- 9. COST-SENSITIVE THRESHOLD ----------
cost_sensitive:
  primary_ratio: "C_FN : C_FP = 5 : 1"
  sensitivity_ratios: ["3:1", "10:1"]
  threshold_search:
    range: [0.1, 0.9]
    step: 0.01
    objective: "argmin_theta [ f_FN(theta)*C_FN + f_FP(theta)*C_FP ]"
    data: "validation fold (not test)"
  cost_matrix:
    TN: 0
    FP: 1
    FN: 5
    TP: 0

# ---------- 10. MODELS (benchmark) ----------
models:
  baselines: ["LogisticRegression", "DecisionTree"]
  ensembles: ["RandomForest", "XGBoost", "LightGBM"]
  tuning:
    methods: ["RandomSearch", "BayesianOptimization"]
    search_space: "defined in Step 3; logged under experiments/"
  hyperparameter_validation: "training fold only (nested CV if required)"

# ---------- 11. METRICS ----------
metrics:
  primary: ["PR-AUC", "Recall", "F2"]
  secondary: ["Precision", "ROC-AUC", "ECE", "Brier", "expected_cost"]
  reporting:
    - "mean ± standard deviation across CV folds"
    - "per window (W2, W4, W6, W8)"
    - "per model"
    - "cross-cohort: delta vs. CV"
  threshold_for_recall_target: "0.85 (design choice; report as such)"

# ---------- 12. REPRODUCIBILITY ----------
reproducibility:
  global_seed: 42
  python_version: "3.10+"
  libraries:
    pandas: "pin"
    numpy: "pin"
    scikit-learn: "pin"
    xgboost: "pin"
    lightgbm: "pin"
    imbalanced-learn: "pin"
    shap: "pin"
    mlflow: "pin"
  tracking: "MLflow (runs, params, artifacts, feature lineage)"
  environment: "requirements.txt + conda env export"
  system_prerequisites:
    macOS:
      - "brew install libomp  # required by xgboost and lightgbm (OpenMP runtime)"

# ---------- 13. SCOPE BOUNDARY ----------
scope:
  primary_deliverable: "ML pipeline + experiments (RQ1–RQ4)"
  secondary_deliverable: "minimal prototype (RQ5) — validation vehicle, not production"
  out_of_scope: ["microservices", "load testing", "production authentication", "institutional deployment"]

# ---------- 14. OUTPUT CONTRACT (SHAP artifacts) ----------
# NOTE: this contract fixes only the OUTPUT SCHEMA of the ML pipeline.
# The serving/UI contract (endpoints, latency, authentication, SCS)
# will be frozen in a separate webapp_protocol.yaml at Step 7.
output_contract:
  grain: "one record per (student_id, window, presentation)"
  format: "JSON Lines (.jsonl), one object per line"
  schema:
    student_id: "int"
    presentation: "str  # e.g. '2013B'"
    window: "str  # 'W2' | 'W4' | 'W6' | 'W8'"
    model_name: "str  # e.g. 'xgboost'"
    model_version: "str  # joblib artifact hash"
    protocol_version: "str  # '1.0.1'"
    risk_score: "float  # calibrated probability, [0,1]"
    threshold_applied: "float  # theta* for the primary cost ratio (5:1)"
    flagged: "bool  # risk_score >= threshold_applied"
    top_positive_factors:
      type: "list[dict]"
      item_schema:
        feature: "str"
        shap_value: "float  # positive contribution (increases risk)"
        feature_value: "float | str"
      ordering: "descending by shap_value"
      max_items: 5
    top_negative_factors:
      type: "list[dict]"
      item_schema:
        feature: "str"
        shap_value: "float  # negative contribution (reduces risk)"
        feature_value: "float | str"
      ordering: "ascending by shap_value"
      max_items: 5
    base_value: "float  # SHAP explainer expected value"
  invariants:
    - "risk_score in [0,1]"
    - "flagged == (risk_score >= threshold_applied)"
    - "top_positive_factors and top_negative_factors have opposite signs"
    - "sum(shap_values) + base_value ≈ risk_score (log-odds or probability; document)"
    - "no artifact is emitted for students excluded by the operational rule (§4)"
  storage:
    location: "results/shap_artifacts/{window}/{presentation}.jsonl"
    index: "PostgreSQL table shap_cache (student_id, window, presentation) — Step 7 only"
  consumers:
    - "offline analysis (RQ4)"
    - "web prototype (RQ5) — via webapp_protocol.yaml at Step 7"
  change_policy: >
    Schema changes require a new protocol_version and full regeneration
    of artifacts. The schema is never altered mid-analysis.
  other_factors_sum: >
      float  # sum of SHAP values not captured in top_positive_factors
             # or top_negative_factors. Enables exact reconstruction:
             # sigmoid(base_value + sum(top5) + other_factors_sum) == risk_score

# ---------- 16. BENCHMARK VARIANTS ----------
benchmark_variants:
  W2_assessment_features:
    variant_A: "retain Delta_t and S_score with training-fold imputation"
    variant_B: "drop Delta_t and S_score in W2 only"
    selection_criterion: "PR-AUC and F2 at W2; report both"
    rationale: >
      Only 1 assessment in all OULAD is due by day 14 (id_assessment=15008,
      module BBB, 2014B). Coverage of assessment features in W2 is ~4%.
      Variant B tests whether these near-constant features add signal or
      noise. The comparison is an empirical contribution, not an a priori
      choice.
  tuning_order:
    step_3: "benchmark with default hyperparameters"
    step_3b: "hyperparameter tuning (RandomSearch / Bayesian)"

